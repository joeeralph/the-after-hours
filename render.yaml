services:
  - type: web
    name: the-after-hours
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.lock
    startCommand: gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: BAND_HTTPS
        value: "1"
      - key: BAND_DATA_DIR
        value: /var/data/the-after-hours
    disk:
      name: band-data
      mountPath: /var/data
      sizeGB: 1
